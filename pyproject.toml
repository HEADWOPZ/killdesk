[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "killdesk"
version = "0.2.0"
description = "Shadow-mode memecoin scanning desk. Public data, typed Jev judgements, no orders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "HEADWOPZ"}]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.12",
    "typer>=0.12",
    "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
killdesk = "killdesk.main:app"

[tool.setuptools.packages.find]
include = ["killdesk*"]

[tool.setuptools.package-data]
"killdesk.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
